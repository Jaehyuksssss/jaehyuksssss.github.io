name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: my_blog/.nvmrc
          cache: npm
          cache-dependency-path: my_blog/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: |
          cd my_blog
          npm ci

      - name: Validate
        run: |
          cd my_blog
          npm run check
          npm test

      - name: Build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.GATSBY_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.GATSBY_SUPABASE_ANON_KEY }}
          PUBLIC_UTTERANCES_REPO: ${{ secrets.GATSBY_UTTERANCES_REPO }}
          PUBLIC_ADSENSE_CLIENT: ${{ secrets.GATSBY_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT: ${{ secrets.GATSBY_ADSENSE_SLOT }}
        run: |
          cd my_blog
          npm run build
          npm run test:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./my_blog/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
